# Auto-deploy report-seo (report.seoprime-th.com) ขึ้น VPS oat@76.13.197.229 — รูปเดียวกับ seo-prime (deploy-guide.md §24)
# push เข้า master → `check` (tsc + unit test) → `deploy` ssh เข้า VPS → git reset → scripts/deploy.sh
# secret: VPS_HOST VPS_USER VPS_SSH_KEY VPS_FINGERPRINT (ECDSA) — ตรวจ: gh secret list -R oat1122/report_seo
name: deploy

on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', '.claude/**', '*.md']
  workflow_dispatch: {}

concurrency:
  group: deploy-report-seo
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      # next-env.d.ts (type ของ import รูป .webp ฯลฯ) ถูก gitignore — Next สร้างให้ตอน build/dev เท่านั้น
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run test:run

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd ~/apps/report-seo/src
            git fetch origin master
            git reset --hard origin/master
            bash scripts/deploy.sh
